<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Car Finder{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    a { color: #6ea8ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: #171a21; padding: 12px 20px; border-bottom: 1px solid #262b36;
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    header .brand { font-weight: 700; font-size: 17px; color: #fff; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262b36; }
    th { color: #9aa0a6; font-weight: 600; font-size: 13px; }
    tr:hover td { background: #161a22; }
    .chip { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid #00000055; vertical-align: middle; margin-right: 6px; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
      font-weight: 600; }
    .verified { background: #16391f; color: #7ee29a; }
    .claimed  { background: #3a3316; color: #e0cf7e; }
    .unknown  { background: #2a2f3a; color: #9aa0a6; }
    .ranked { background: #16391f; color: #7ee29a; }
    .needs_review { background: #3a3316; color: #e0cf7e; }
    .excluded { background: #3a1c1c; color: #e08a8a; }
    .fail { color: #e08a8a; } .pass { color: #7ee29a; }
    .new { background: #16305a; color: #9ec2ff; }
    .sold { background: #2a2f3a; color: #9aa0a6; text-decoration: line-through; }
    .score { font-weight: 700; font-size: 16px; }
    .muted { color: #9aa0a6; }
    .bar { height: 8px; background: #262b36; border-radius: 4px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #6ea8ff; }
    button { font: inherit; background: #2452a6; color: #fff; border: 0; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; }
    button:disabled { background: #2a2f3a; color: #9aa0a6; cursor: not-allowed; }
    button.secondary { background: #262b36; color: #cfd6e4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card { background: #171a21; border: 1px solid #262b36; border-radius: 8px; padding: 14px; }
    .flash { background: #16305a; color: #9ec2ff; border: 1px solid #2452a6; border-radius: 8px;
      padding: 10px 14px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px;
      border-radius: 14px; font-size: 13px; font-weight: 600; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill.running { background: #16305a; color: #9ec2ff; }
    .pill.done { background: #16391f; color: #7ee29a; }
    .pill.error { background: #3a1c1c; color: #e08a8a; }
    .spin { display: inline-block; width: 11px; height: 11px; flex: none;
      border: 2px solid transparent; border-top-color: currentColor;
      border-right-color: currentColor; border-radius: 50%;
      animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <span class="brand">🏎️ Car Finder</span>
    <a href="/">Home</a>
    <a href="/config">Config</a>
    <a href="/budget">Budget</a>
    <a href="/conflicts">Conflicts</a>
    <!-- flex:1 + min-width:0 lets the pill use all remaining header width
         (ellipsizing only when truly out of room) instead of hugging the button. -->
    <div style="margin-left:auto; flex:1; min-width:0; display:flex; align-items:center;
                justify-content:flex-end; gap:14px">
      <span id="job-pill" class="pill" hidden></span>
      <form method="post" action="/sync" data-job style="flex:none">
        <button type="submit">Sync now</button>
      </form>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      const pill = document.getElementById("job-pill");
      let sawRunning = false;

      function render(job) {
        const running = job.state === "running";
        document.querySelectorAll("form[data-job] button")
          .forEach(function (b) { b.disabled = running; });
        if (running) {
          pill.hidden = false;
          pill.className = "pill running";
          pill.replaceChildren();
          const s = document.createElement("span");
          s.className = "spin";
          pill.append(s, " " + job.kind + " — " + (job.detail || "working…"));
        } else if (job.state === "done" && sawRunning) {
          // A job we watched just finished: reload so results show immediately.
          location.reload();
          return;
        } else if (job.state === "done") {
          pill.hidden = false;
          pill.className = "pill done";
          pill.textContent = "✓ " + job.kind + " finished — " + (job.summary || "done");
        } else if (job.state === "error") {
          pill.hidden = false;
          pill.className = "pill error";
          pill.textContent = "✗ " + job.kind + " failed — " + (job.error || "");
          pill.title = job.error || "";
        } else {
          pill.hidden = true;
        }
        sawRunning = running;
      }

      async function poll() {
        let delay = 8000;
        try {
          const r = await fetch("/api/job");
          const job = (await r.json()).job;
          render(job);
          if (job.state === "running") delay = 1500;
        } catch (e) { /* server briefly unreachable; retry */ }
        setTimeout(poll, delay);
      }
      poll();
    })();
  </script>
</body>
</html>
