services:
  carfinder:
    build: .
    image: carfinder:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent state + the profiles you can hot-edit. stickers is a cache
      # of GM PDFs; data holds the SQLite DB.
      - ./data:/data
      - ./stickers:/stickers
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
