services:
  carfinder:
    build: .
    image: carfinder:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Pin container paths to the mounted volumes. `environment` beats
    # `env_file`, so relative paths in .env (meant for local runs) can't
    # redirect the DB/stickers into the container's own filesystem — that
    # would silently lose all state on the next rebuild.
    environment:
      CARFINDER_DB_PATH: /data/carfinder.sqlite
      CARFINDER_STICKERS_DIR: /stickers
      CARFINDER_CONFIG_DIR: /config
    volumes:
      # Persistent state + the profiles you can hot-edit. stickers is a cache
      # of GM PDFs; data holds the SQLite DB.
      - ./data:/data
      - ./stickers:/stickers
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
