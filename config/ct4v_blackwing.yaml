name: Cadillac CT4-V Blackwing
model_key: ct4v_blackwing

# Server-side prefilter (Auto.dev). Wider than the hard bounds by design.
# NOTE (2026-07-16 count probes): Auto.dev files most of these cars under
# model "CT4" with trim "V Blackwing" — the "CT4-V" bucket holds only ~14
# cars nationally (mostly non-Blackwings). Query BOTH buckets (comma list)
# with the trim filter: ~160 real Blackwings vs 15 before. price_margin is
# wide because Blackwings often list above the hard bound and drop into
# range later — the tracker watches for exactly that.
query:
  make: Cadillac
  model: "CT4,CT4-V"
  trim: V Blackwing
  price_margin: 0.40

# --- Hard requirements (verified-only pass/fail) --------------------------
hard:
  - key: model_ct4v_blackwing
    label: CT4-V Blackwing
    kind: require
    matcher:
      # VIN pos 8 engine: P = 3.6TT LF4 (Blackwing-only), L = 2.7T (never a
      # Blackwing) — corpus-verified in src/carfinder/vin.py. Transmission is
      # NOT in the VIN; manual still requires the sticker (MG9).
      vin_attr: model
      vin_any: [BLACKWING]
      sticker_text: "CT4-V BLACKWING|BLACKWING"

  - key: year_2022_plus
    label: 2022 or newer
    kind: year_min
    min_year: 2022

  - key: manual_transmission
    label: 6-speed manual
    kind: require
    matcher:
      # VIN pos 5 on Blackwings: 6 = manual, 7 = automatic (6/6 corpus
      # cars; 2023's unified DL5 series decodes to nothing and falls
      # through). MG9 VERIFIED against 1G6D65RP8N0460286 (manual car); the
      # text regex also matches build-sheet transmission lines.
      vin_attr: trans
      vin_any: [MANUAL]
      rpo: MG9
      sticker_text: "6-SPEED MANUAL|6 SPEED MANUAL|MANUAL TRANSMISSION"

  # Super Cruise / auto excluded implicitly by the manual requirement; a
  # verified automatic sticker will fail manual_transmission above.
  - key: ventilated_seats
    label: Ventilated seats
    kind: require
    matcher:
      rpo: KU9          # VERIFIED on 1G6D65RP8N0460286 (ventilated frt seats)
      sticker_text: "VENTILATED"

  - key: head_up_display
    label: Head-Up Display
    kind: require
    matcher:
      rpo: UV6          # VERIFIED on 1G6D65RP8N0460286 (HUD)
      sticker_text: "HEAD-UP DISPLAY|HEAD UP DISPLAY|HUD"

# --- Soft requirements (weighted penalty curves) --------------------------
soft:
  - key: miles
    label: Mileage
    kind: numeric
    attr: miles
    ideal: 50000
    hard: 60000
    direction: lower_better
    weight: 0.20

  - key: price
    label: Price
    kind: numeric
    attr: price
    ideal: 60000
    hard: 65000        # "for sure less than" -> hard bound
    direction: lower_better
    weight: 0.25
    # With the wide prefilter above, over-budget cars are now ingested for
    # price-drop tracking — this keeps them OUT of the ranked list until
    # their asking price actually falls under the hard bound.
    exclude_beyond_hard: true

  - key: color
    label: Color
    kind: color
    weight: 0.10
    preferred: [blue]
    penalized: [black, white, red]

# --- Highlights (bonus badges; total capped at +10 by the scorer) ---------
highlights:
  # Genuinely valuable
  - label: Carbon Fiber Package 1
    bonus: 8
    matcher:
      rpo: CFZ
      sticker_text: "CARBON FIBER 1|CARBON FIBER PACKAGE 1"
  - label: Carbon Fiber Package 2
    bonus: 6
    matcher:
      rpo: CFV
      sticker_text: "CARBON FIBER 2|CARBON FIBER PACKAGE 2"
  - label: Sueded microfiber package
    bonus: 3
    matcher:
      sticker_text: "SUEDED MICROFIBER|SUEDE.*STEERING|ALCANTARA"
  - label: Power sunroof
    bonus: 3
    matcher:
      rpo: CF5          # VERIFIED on 1G6D65RP8N0460286 (sunroof $1,050)
      sticker_text: "SUNROOF"
  - label: Performance Data Recorder
    bonus: 2
    matcher:
      rpo: UQT          # VERIFIED on 1G6D65RP8N0460286 (PDR $1,600)
      sticker_text: "PERFORMANCE DATA"
  - label: Massaging seats
    bonus: 2
    matcher:
      sticker_text: "MASSAG"

  # Cosmetic
  - label: Painted calipers
    bonus: 1
    matcher:
      # Real stickers print "BRAKE CALIPERS, RED" (color AFTER the noun) —
      # original color-first pattern missed it. Fixed against 0460286.
      sticker_text: "(BRONZE|RED|BLUE).{0,20}CALIPER|CALIPERS?,?\\s*(BRONZE|RED|BLUE)"
  - label: Red seat belts
    bonus: 3
    matcher:
      sticker_text: "TORCH RED SEAT BELT|RED SEAT BELT"
  - label: Upgraded wheel finish
    bonus: 1
    matcher:
      sticker_text: "BLACK.*WHEEL|POLISHED.*WHEEL|DIAMOND CUT"

  # Throwaway (badge only)
  - label: Dealer-pack accessories
    bonus: 0
    matcher:
      sticker_text: "CARGO MAT|CARGO NET|ILLUMINATED.*SILL|WHEEL LOCK|LUG"
